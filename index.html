<!DOCTYPE html>

    <!-- Sfondo. Ricordati di caricare un'immagine chiamata 'sfondo.jpg' -->

            <!-- Logo in alto a sinistra -->
            <img src="logo.png" alt="LSC Logo Piccolo">

        <nav class="navbar-center">

            <a href="storia.html">About Us</a>

        <span style="font-weight:bold; border: 1px solid white; border-radius: 50%; padding: 2px 5px;">LSC</span>

    </div>
