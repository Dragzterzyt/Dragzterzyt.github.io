<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Santos Customs - Galleria Lavori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>

    <header>
        <div class="logo-small">
            <img src="logo.png" alt="LSC Logo">
        </div>
        
        <nav class="navbar-center">
            <a href="index.html">Home</a>
            <a href="storia.html">Storia</a>
            <a href="listino.html">Listino Prezzi</a>
            <a href="foto.html">Foto Lavori</a>
        </nav>

        <div class="navbar-right">
            <a href="https://cfx.re/join/6my4kj4" target="_blank" class="btn-outline-small">Entra in Città</a>
        </div>
    </header>

    <div class="container">
        <div class="section-block">
            <h2>Foto Lavori</h2>
            <p class="section-desc">Le nostre creazioni più recenti e le customizzazioni più estreme. Clicca sulle foto per ingrandirle.</p>
            
            <div class="gallery-grid">
                
                <!-- SLOT 1 -->
                <div class="photo-card" onclick="openLightbox('auto1.jpg', 'Sunrise Custom')">
                    <div class="img-wrapper">
                        <img src="auto1.jpg" alt="Sunrise">
                    </div>
                    <div class="photo-caption">Sunrise Custom</div>
                </div>
                
                <!-- SLOT 2 -->
                <div class="photo-card" onclick="openLightbox('auto2.jpg', 'Elegy Retro')">
                    <div class="img-wrapper">
                        <!-- Sostituisci il link di placeholder con auto2.jpg appena ce l'hai -->
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto2.jpg" alt="Elegy">
                    </div>
                    <div class="photo-caption">Elegy Retro</div>
                </div>
                
                <!-- SLOT 3 -->
                <div class="photo-card" onclick="openLightbox('auto3.jpg', 'Banshee 900R')">
                    <div class="img-wrapper">
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto3.jpg" alt="Banshee">
                    </div>
                    <div class="photo-caption">Banshee 900R</div>
                </div>

                <!-- SLOT 4 -->
                <div class="photo-card" onclick="openLightbox('auto4.jpg', 'Nissan Skyline GT-R')">
                    <div class="img-wrapper">
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto4.jpg" alt="Skyline">
                    </div>
                    <div class="photo-caption">Nissan Skyline GT-R</div>
                </div>

                <!-- SLOT 5 -->
                <div class="photo-card" onclick="openLightbox('auto5.jpg', 'Sultan RS')">
                    <div class="img-wrapper">
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto5.jpg" alt="Sultan">
                    </div>
                    <div class="photo-caption">Sultan RS</div>
                </div>

                <!-- SLOT 6 -->
                <div class="photo-card" onclick="openLightbox('auto6.jpg', 'Karin Kuruma')">
                    <div class="img-wrapper">
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto6.jpg" alt="Kuruma">
                    </div>
                    <div class="photo-caption">Karin Kuruma</div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- STRUTTURA DEL LIGHTBOX (Finestra a schermo intero nascosta) -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- SCRIPT PER FAR FUNZIONARE IL CLIC SULLE FOTO -->
    <script>
        function openLightbox(imageSrc, captionText) {
            document.getElementById('lightbox-img').src = imageSrc;
            document.getElementById('lightbox-caption').innerText = captionText;
            document.getElementById('lightbox').style.display = 'flex'; // Mostra il box
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none'; // Nasconde il box
        }
    </script>

</body>
</html>
