<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Santos Customs - Galleria Lavori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Los Santos Customs Logo">
        </div>
        <nav class="navbar">
            <a href="index.html">Storia</a>
            <a href="listino.html">Listino Prezzi</a>
            <a href="foto.html">Foto Lavori</a>
            <a href="contatti.html">Contatti e Candidature</a>
        </nav>
    </header>

    <div class="container">
        <!-- SEZIONE FOTO LAVORI -->
        <div class="section-block">
            <h2>Foto Lavori</h2>
            <p class="section-desc">Le nostre creazioni più recenti e le customizzazioni più estreme.</p>
            <div class="gallery-grid">
                
                <!-- LAVORO 1: Sunrise (Aggiornato) -->
                <div class="photo-card">
                    <img src="auto1.jpg" alt="Sunrise">
                    <div class="photo-caption">Sunrise</div>
                </div>
                
                <!-- LAVORO 2 -->
                <div class="photo-card">
                    <img src="https://via.placeholder.com/300x200" alt="Lavoro 2">
                    <div class="photo-caption">Elegy Retro Custom</div>
                </div>
                
                <!-- LAVORO 3 -->
                <div class="photo-card">
                    <img src="https://via.placeholder.com/300x200" alt="Lavoro 3">
                    <div class="photo-caption">Banshee 900R</div>
                </div>
                
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Los Santos Customs. Sito ufficiale per server FiveM. Tutti i diritti riservati. -Drag
    </footer>
