<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Santos Customs - Galleria Lavori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-image"></div>

    <header>
        <div class="logo-small">
            <img src="logo.png" alt="LSC Logo">
        </div>
        
        <nav class="navbar-center">
            <a href="index.html">Home</a>
            <a href="storia.html">Storia</a>
            <a href="listino.html">Listino Prezzi</a>
            <a href="foto.html">Foto Lavori</a>
        </nav>

        <div class="navbar-right">
            <a href="https://cfx.re/join/6my4kj4" target="_blank" class="btn-outline-small">Entra in Città</a>
        </div>
    </header>

    <div class="container">
        <div class="section-block">
            <h2>Foto Lavori</h2>
            <p class="section-desc">Le nostre creazioni più recenti e le customizzazioni più estreme. Clicca sulle foto per ingrandirle.</p>
            
            <div class="gallery-grid">
                
                <!-- SLOT 1 -->
                <div class="photo-card" onclick="openLightbox('1.jpg', 'Honda Civic 2000')">
                    <div class="img-wrapper">
                        <img src="1.jpg" alt="Civic">
                    </div>
                    <div class="photo-caption">Civic 2000</div>
                </div>
                
                <!-- SLOT 2 -->
                <div class="photo-card" onclick="openLightbox('2.jpg', 'Fiat Punto')">
                    <div class="img-wrapper">
                        <!-- Sostituisci il link di placeholder con auto2.jpg appena ce l'hai -->
                        <img src="2.jpg" alt="Punto">
                    </div>
                    <div class="photo-caption">Fiat Punto</div>
                </div>
                
                <!-- SLOT 3 -->
                <div class="photo-card" onclick="openLightbox('3.jpg', 'Mclaren P1')">
                    <div class="img-wrapper">
                        <img src="3.jpg" alt="P1">
                    </div>
                    <div class="photo-caption">Mclaren P1</div>
                </div>

                <!-- SLOT 4 -->
                <div class="photo-card" onclick="openLightbox('4.jpg', 'Audi RSQ8')">
                    <div class="img-wrapper">
                        <img src="4.jpg" alt="RSQ8">
                    </div>
                    <div class="photo-caption">Audi RSQ8</div>
                </div>

                <!-- SLOT 5 -->
                <div class="photo-card" onclick="openLightbox('5.jpg', 'Porsche GT3RS')">
                    <div class="img-wrapper">
                        <img src="5.jpg" alt="Porsche GT3RS">
                    </div>
                    <div class="photo-caption">Porsche GT3RS</div>
                </div>

                <!-- SLOT 6 -->
                <div class="photo-card" onclick="openLightbox('auto6.jpg', 'Karin Kuruma')">
                    <div class="img-wrapper">
                        <img src="https://via.placeholder.com/400x300/333/fff?text=Metti+auto6.jpg" alt="Kuruma">
                    </div>
                    <div class="photo-caption">Karin Kuruma</div>
                </div>
                
                <!-- SLOT 7 -->
                <div class="photo-card" onclick="openLightbox('1.jpg', 'Honda Civic 2000')">
                    <div class="img-wrapper">
                        <img src="1.jpg" alt="Civic">
                    </div>
                    <div class="photo-caption">Civic 2000</div>
                </div>
                
                <!-- SLOT 8 -->
                <div class="photo-card" onclick="openLightbox('1.jpg', 'Honda Civic 2000')">
                    <div class="img-wrapper">
                        <img src="1.jpg" alt="Civic">
                    </div>
                    <div class="photo-caption">Civic 2000</div>
                </div>
                
                <!-- SLOT 9 -->
                <div class="photo-card" onclick="openLightbox('1.jpg', 'Honda Civic 2000')">
                    <div class="img-wrapper">
                        <img src="1.jpg" alt="Civic">
                    </div>
                    <div class="photo-caption">Civic 2000</div>
                </div>
                
            </div>
        </div>
    </div>

    <!-- STRUTTURA DEL LIGHTBOX (Finestra a schermo intero nascosta) -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- SCRIPT PER FAR FUNZIONARE IL CLIC SULLE FOTO -->
    <script>
        function openLightbox(imageSrc, captionText) {
            document.getElementById('lightbox-img').src = imageSrc;
            document.getElementById('lightbox-caption').innerText = captionText;
            document.getElementById('lightbox').style.display = 'flex'; // Mostra il box
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none'; // Nasconde il box
        }
    </script>

</body>
</html>
