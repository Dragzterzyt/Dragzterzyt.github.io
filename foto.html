<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Los Santos Customs - Galleria Lavori</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-small"><img src="logo.png" alt="LSC Logo"></div>
        <nav class="navbar-center">
            <a href="index.html">Home</a>
            <a href="storia.html">Storia</a>
            <a href="listino.html">Listino Prezzi</a>
            <a href="foto.html">I Nostri Lavori</a>
        </nav>
        <div class="navbar-right">
            <a href="https://cfx.re/join/6my4kj4" target="_blank" class="btn-outline-small">Entra in Città</a>
        </div>
    </header>

    <div class="container">
        <div class="section-block">
            <h2>Foto Lavori</h2>
            <p style="text-align:center; color:var(--text-gray); margin-bottom:30px;">Le nostre creazioni più recenti e le customizzazioni più estreme.</p>
            <div class="gallery-grid">
                <div class="photo-card">
                    <img src="auto0.5.jpg" alt="Sunrise">
                    <div style="margin-top:10px; font-weight:bold; text-transform:uppercase;">Sunrise</div>
                </div>
                <div class="photo-card">
                    <img src="auto2.jpg" alt="Lamborghini">
                    <div style="margin-top:10px; font-weight:bold; text-transform:uppercase;">Lamborghini Revuelto</div>
                </div>
                <div class="photo-card">
                    <img src="auto3.jpg" alt="Harley">
                    <div style="margin-top:10px; font-weight:bold; text-transform:uppercase;">Harley Davidson Hussar</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
